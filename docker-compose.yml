# Data_Insights Docker Compose
# Adds FastAPI chat API to the stack for LLM/agent chat

version: "3.8"

services:
  chat-api:
    build:
      context: .
      dockerfile: Dockerfile.chat_api
    container_name: chat-api
    command: uvicorn src.backend.ai.chat_api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - ollama

  chat-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-mcp
    command: uvicorn src.chat.mcp_server:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_MODELS=mistral
      - NVIDIA_VISIBLE_DEVICES=all # Enable all GPUs for Ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama-data:
