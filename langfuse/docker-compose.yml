# Langfuse Docker Compose for Local Observability
# This file is for local development and observability of LLMs and agents in Data_Insights.
# All services run locally and data is stored in Docker volumes for persistence.

version: "3.8"

services:
  langfuse-web:
    image: langfuse/langfuse:2
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - langfuse-web-data:/data

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - langfuse-worker-data:/data

  postgres:
    image: postgres:15
    env_file:
      - ../.env
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:23.3
    ports:
      - "9000:9000"
      - "8123:8123"
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000" # Host 9002 -> Container 9000
      - "9001:9001"
    env_file:
      - ../.env
    volumes:
      - minio-data:/data

volumes:
  langfuse-web-data:
  langfuse-worker-data:
  postgres-data:
  clickhouse-data:
  redis-data:
  minio-data:
